name: study_flow
description: "ENote - A modern student management and productivity application."
publish_to: 'none'
version: 1.0.2+3

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.50.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  material_ui: ^1.11.1
  cupertino_ui: ^1.1.7
  intl: ^0.20.2
  drift: ^2.31.0
  drift_flutter: ^0.3.1
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  path_provider: ^2.1.3
  web: ^1.1.1
  path: ^1.9.0
  shared_preferences: ^2.2.3

dev_dependencies:
  drift_dev: ^2.31.0
  build_runner: ^2.4.9
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - public/assets/enote-icon.png
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo.ttf
