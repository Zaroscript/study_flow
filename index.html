<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ENote</title>
    <meta name="application-name" content="ENote" />
    <link rel="icon" type="image/png" href="/assets/enote-icon.png" />
    <link rel="apple-touch-icon" href="/assets/enote-icon.png" />
    <meta name="theme-color" content="#f7f7fb" />
    <script>
      try {
        const language = localStorage.getItem('enote_language') === 'en' ? 'en' : 'ar';
        document.documentElement.lang = language;
        document.documentElement.dir = language === 'ar' ? 'rtl' : 'ltr';
        document.documentElement.style.colorScheme = localStorage.getItem('studyflow_theme') === 'dark' ? 'dark' : 'light';
      } catch {}
    </script>
    <!-- Cairo Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
