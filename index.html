<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Google Search Console ownership (URL-prefix property for this site). -->
    <meta name="google-site-verification" content="yqAze3OUoFoBIT_pQjC3gybVL-jhGBfyeZPypInhB2Q" />
    <!--
      SEO block: scripts/prerender-seo.cjs (run by `pnpm build` after vite) replaces everything between the
      seo:head markers, and the seo:body marker inside #root, once per language, to emit dist/index.html (ar)
      and dist/en/index.html. Text comes from landing-seo.json and the `copy` object in Landing.tsx.
      The title below is only the fallback for `vite` dev.
    -->
    <!-- seo:head:start -->
    <title>ENote</title>
    <!-- seo:head:end -->

    <script>
      (function () {
        try {
          var root = document.documentElement;
          var path = location.pathname;
          var landing = path === '/' || /^\/en\/?$/.test(path);
          var requested = new URLSearchParams(location.search).get('lang');
          if (landing) {
            // The static HTML of "/" is Arabic and of "/en/" English. Only "/" can disagree with the visitor's
            // choice (?lang=en or a saved English preference): hide the static copy until React renders the
            // right language so nobody sees a flash of the wrong one. Crawlers/no-JS never reach this branch.
            var wants = requested === 'en' || requested === 'ar' ? requested : localStorage.getItem('enote_landing_language') === 'en' ? 'en' : 'ar';
            if (path === '/' && wants === 'en') {
              root.lang = 'en';
              root.dir = 'ltr';
              root.setAttribute('data-lang-mismatch', '');
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"><!-- seo:body --><!-- /seo:body --></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
