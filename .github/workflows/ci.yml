name: CI & Deployment Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-build:
    name: Build & Verify Production App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest
          run_install: false

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build Web Application & Landing Page
        run: pnpm run build

      - name: Verify build artifacts
        run: |
          test -f dist/index.html || { echo "dist/index.html is missing"; exit 1; }
          test -f dist/downloads/ENote-v1.0.0.apk || { echo "Release APK is missing"; exit 1; }
          echo "Production artifacts verified successfully!"
