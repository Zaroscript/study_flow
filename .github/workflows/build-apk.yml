name: Build Flutter Android Release APK

on:
  push:
    branches: [ main ]
    paths:
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Verify Android Structure & Branding
        run: |
          test -f android/app/build.gradle || { echo "android/app/build.gradle missing"; exit 1; }
          ls -lh android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Verify APK Binary
        run: |
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Update downloads folder in repository
        run: |
          mkdir -p public/downloads
          cp build/app/outputs/flutter-apk/app-release.apk public/downloads/ENote-v1.0.0.apk
          cp build/app/outputs/flutter-apk/app-release.apk public/downloads/ENote.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/downloads/ENote-v1.0.0.apk public/downloads/ENote.apk
          git commit -m "chore(release): auto-compile genuine Flutter Android APK v1.0.0 [skip ci]" || echo "No changes to commit"
          git push origin main || echo "Failed to push to main directly"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ENote-v1.0.0.apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: ENote Official Android Release v1.0.0
          body: |
            ## 📱 ENote Android Release v1.0.0
            تطبيق ENote الرسمي للأندرويد — مبني ومُوقّع بمحرك فلاتر الرسمي (Flutter 3.22):
            - ⏱️ ساعة بومودورو 3D القلابة مع صوت تكتكة ميكانيكي.
            - 🤖 مساعد الذكاء الاصطناعي الحقيقي لتلخيص المحاضرات وتوليد خطط المذاكرة.
            - 📚 مكتبة الملازم والكتب وتنظيم المذكرات بمجلدات مخصصة.
            - 🏆 نظام المكافآت والأوسمة ونقاط الخبرة XP.
            
            **طريقة التثبيت:**
            قم بتحميل ملف `app-release.apk` أو `ENote-v1.0.0.apk` وافتحه على هاتفك للتثبيت المباشر.
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
