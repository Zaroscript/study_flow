name: Build Flutter Android Release APK

on:
  push:
    branches: [ main ]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Initialize Android Platform and Configure ENote Branding
        run: |
          flutter create . --platforms=android --org=com.enote.studyflow
          
          python3 -c "
          import re
          path = 'android/app/build.gradle'
          with open(path, 'r') as f:
              content = f.read()
          content = re.sub(r'compileSdk\s*=\s*flutter\.compileSdkVersion', 'compileSdk = 34', content)
          content = re.sub(r'compileSdkVersion\s+flutter\.compileSdkVersion', 'compileSdkVersion 34', content)
          content = re.sub(r'targetSdk\s*=\s*flutter\.targetSdkVersion', 'targetSdk = 34', content)
          content = re.sub(r'targetSdkVersion\s+flutter\.targetSdkVersion', 'targetSdkVersion 34', content)
          with open(path, 'w') as f:
              f.write(content)
          "
          
          python3 -c "
          import os, shutil
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          if os.path.exists(manifest_path):
              with open(manifest_path, 'r') as f:
                  m = f.read()
              m = m.replace('android:label=\"study_flow\"', 'android:label=\"ENote\"')
              with open(manifest_path, 'w') as f:
                  f.write(m)

          icon_src = 'public/assets/enote-icon.png'
          if os.path.exists(icon_src):
              for density in ['mdpi', 'hdpi', 'xhdpi', 'xxhdpi', 'xxxhdpi']:
                  d_path = f'android/app/src/main/res/mipmap-{density}'
                  os.makedirs(d_path, exist_ok=True)
                  shutil.copy(icon_src, os.path.join(d_path, 'ic_launcher.png'))
          "

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Verify APK Binary
        run: |
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Update downloads folder in repository
        run: |
          mkdir -p public/downloads
          cp build/app/outputs/flutter-apk/app-release.apk public/downloads/ENote-v1.0.0.apk
          cp build/app/outputs/flutter-apk/app-release.apk public/downloads/ENote.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/downloads/ENote-v1.0.0.apk public/downloads/ENote.apk
          git commit -m "chore(release): auto-compile genuine Flutter Android APK v1.0.0 [skip ci]" || echo "No changes to commit"
          git push origin main || echo "Failed to push to main directly"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ENote-v1.0.0.apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: ENote Official Android Release v1.0.0
          body: |
            ## 📱 ENote Android Release v1.0.0
            تطبيق ENote الرسمي للأندرويد — مبني ومُوقّع بمحرك فلاتر الرسمي (Flutter 3.22):
            - ⏱️ ساعة بومودورو 3D القلابة مع صوت تكتكة ميكانيكي.
            - 🤖 مساعد الذكاء الاصطناعي الحقيقي لتلخيص المحاضرات وتوليد خطط المذاكرة.
            - 📚 مكتبة الملازم والكتب وتنظيم المذكرات بمجلدات مخصصة.
            - 🏆 نظام المكافآت والأوسمة ونقاط الخبرة XP.
            
            **طريقة التثبيت:**
            قم بتحميل ملف `app-release.apk` أو `ENote-v1.0.0.apk` وافتحه على هاتفك للتثبيت المباشر.
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
